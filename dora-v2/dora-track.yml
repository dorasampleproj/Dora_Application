name: DORA Lead Time Tracker

# ─────────────────────────────────────────────
# Trigger 1: auto on push to main → DEV deploy
# Trigger 2: manual promotion to any environment
# ─────────────────────────────────────────────
on:
  push:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (DEV / SIT / UAT / MO / PROD)"
        required: true
        type: choice
        options: [DEV, SIT, UAT, MO, PROD]
      build_number:
        description: "Build number to promote (e.g. build-3)"
        required: true
        type: string
      feature_id:
        description: "Feature ID (e.g. FEAT-1) — required for manual promotions"
        required: true
        type: string
      story_id:
        description: "User story ID (e.g. US-42) — required for manual promotions"
        required: true
        type: string

jobs:
  track-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Parse commit message for [FEAT-X][US-Y] tags ──────────────────────
      - name: Extract feature and story IDs from commit (push trigger)
        if: github.event_name == 'push'
        id: parse
        run: |
          MSG=$(git log -1 --format="%s" "$GITHUB_SHA")
          echo "Commit message: $MSG"

          FEAT=$(echo "$MSG" | grep -oP '(?<=\[)FEAT-[^\]]+(?=\])' | head -1)
          STORY=$(echo "$MSG" | grep -oP '(?<=\[)US-[^\]]+(?=\])' | head -1)

          if [ -z "$FEAT" ] || [ -z "$STORY" ]; then
            echo "No [FEAT-x][US-y] tags found in commit message. Skipping DORA tracking."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "feature_id=$FEAT" >> $GITHUB_OUTPUT
          echo "story_id=$STORY"  >> $GITHUB_OUTPUT
          echo "env=DEV"          >> $GITHUB_OUTPUT
          echo "skip=false"       >> $GITHUB_OUTPUT

      # ── For manual promotions, use workflow_dispatch inputs ───────────────
      - name: Set values for manual promotion
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          echo "feature_id=${{ github.event.inputs.feature_id }}" >> $GITHUB_OUTPUT
          echo "story_id=${{ github.event.inputs.story_id }}"     >> $GITHUB_OUTPUT
          echo "env=${{ github.event.inputs.environment }}"       >> $GITHUB_OUTPUT
          echo "build_number=${{ github.event.inputs.build_number }}" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      # ── Skip if no tags found on push ─────────────────────────────────────
      - name: Check skip
        if: |
          (github.event_name == 'push' && steps.parse.outputs.skip == 'true')
        run: |
          echo "Commit has no DORA tags — skipping."
          exit 0

      # ── Report deployment event to collector ──────────────────────────────
      - name: Report deployment event
        if: |
          (github.event_name == 'push' && steps.parse.outputs.skip != 'true') ||
          github.event_name == 'workflow_dispatch'
        env:
          COLLECTOR_URL:   ${{ secrets.DORA_COLLECTOR_URL }}
          COLLECTOR_TOKEN: ${{ secrets.DORA_COLLECTOR_TOKEN }}
        run: |
          # Resolve values from the right step
          if [ "${{ github.event_name }}" = "push" ]; then
            FEAT="${{ steps.parse.outputs.feature_id }}"
            STORY="${{ steps.parse.outputs.story_id }}"
            ENV="${{ steps.parse.outputs.env }}"
            BUILD_NUM=""           # collector will assign / increment
          else
            FEAT="${{ steps.manual.outputs.feature_id }}"
            STORY="${{ steps.manual.outputs.story_id }}"
            ENV="${{ steps.manual.outputs.env }}"
            BUILD_NUM="${{ steps.manual.outputs.build_number }}"
          fi

          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"

          # Find first-commit time for this feature/story on push
          FIRST_COMMIT_AT=""
          if [ "${{ github.event_name }}" = "push" ]; then
            MERGE_BASE=$(git merge-base HEAD origin/main 2>/dev/null \
                         || git merge-base HEAD origin/master 2>/dev/null \
                         || echo "")
            if [ -n "$MERGE_BASE" ]; then
              FIRST_COMMIT_AT=$(git log --reverse --format="%aI" "${MERGE_BASE}..HEAD" | head -1)
            fi
            if [ -z "$FIRST_COMMIT_AT" ]; then
              FIRST_COMMIT_AT=$(git log --reverse --format="%aI" \
                "${{ github.event.before }}..$GITHUB_SHA" | head -1)
            fi
            if [ -z "$FIRST_COMMIT_AT" ]; then
              FIRST_COMMIT_AT="$DEPLOYED_AT"
            fi
          fi

          echo "Reporting: FEAT=$FEAT STORY=$STORY BUILD=$BUILD_NUM ENV=$ENV"

          PAYLOAD=$(cat <<JSON
          {
            "repo":             "$REPO",
            "feature_id":       "$FEAT",
            "story_id":         "$STORY",
            "build_number":     "$BUILD_NUM",
            "environment":      "$ENV",
            "sha":              "$SHA",
            "first_commit_at":  "$FIRST_COMMIT_AT",
            "deployed_at":      "$DEPLOYED_AT"
          }
          JSON
          )

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$COLLECTOR_URL/api/event" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $COLLECTOR_TOKEN" \
            -d "$PAYLOAD")

          cat /tmp/response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Collector returned HTTP $HTTP_STATUS — failing build"
            exit 1
          fi
          echo "Event recorded successfully (HTTP $HTTP_STATUS)"
